<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gmail Cleanup — Login</title>
<link rel="stylesheet" href="/static/css/design-system.css?v={{ cache_bust }}">
<link rel="stylesheet" href="/static/vendor/tabler-icons/tabler-icons.min.css?v={{ cache_bust }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div style="display:flex;justify-content:center;padding-top:60px">
  <div class="card" style="width:280px;display:flex;flex-direction:column;gap:14px;align-items:center">
    <i class="ti ti-mail" style="font-size:30px;color:var(--accent)"></i>
    <div class="heading" style="font-size:18px">Inbox cleanup</div>
    <form id="loginForm" style="width:100%;display:flex;flex-direction:column;gap:14px;align-items:center">
      <div style="width:100%">
        <div class="label-11">Password</div>
        <input type="password" id="passwordInput" style="width:100%" autocomplete="current-password" autofocus required>
      </div>
      <div id="loginError" style="font-size:12px;color:var(--danger-text);align-self:flex-start;display:none">Incorrect password</div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');
    const password = document.getElementById('passwordInput').value;

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });

        if (response.ok) {
            const params = new URLSearchParams(window.location.search);
            window.location.href = params.get('next') || '/';
            return;
        }

        errorEl.textContent = 'Incorrect password';
        errorEl.style.display = 'block';
    } catch (error) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
    }
});
</script>
</body>
</html>
