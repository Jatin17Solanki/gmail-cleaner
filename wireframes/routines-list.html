<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gmail Cleanup — Routines</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="frame-note">Reference: Routines list (Phase 4b). See routines-create.html and routines-confirm.html for the other two states in this flow.</div>
<div class="app-shell">
  <div class="sidebar">
    <div class="brand"><i class="ti ti-mail"></i>Cleanup</div>
    <a class="nav-item"><i class="ti ti-trash"></i>Delete</a>
    <a class="nav-item"><i class="ti ti-mail-opened"></i>Mark as read</a>
    <a class="nav-item"><i class="ti ti-archive"></i>Archive</a>
    <a class="nav-item active"><i class="ti ti-repeat"></i>Routines</a>
    <a class="nav-item"><i class="ti ti-history"></i>Restore</a>
  </div>
  <div class="content">
    <div class="topbar">
      <span style="font-size:12px;color:var(--text-muted)">experiments.jatin@gmail.com</span>
      <button class="btn" style="margin-left:auto"><i class="ti ti-plus"></i> New routine</button>
    </div>
    <div class="list-area">
      <div class="row">
        <div style="flex:1">
          <div class="meta-title">Market newsletters</div>
          <div class="meta-sub">3 senders · older than 7 days · Delete</div>
        </div>
        <span style="font-size:11px;color:var(--text-muted)">Last run: 2 days ago</span>
        <button class="btn"><i class="ti ti-player-play"></i> Run</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
