<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gmail Cleanup — Login</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="frame-note">Reference: Login screen (Phase 1.3). Single shared password, session-cookie gated. No self-service reset — see PRD Section 6, Phase 1.</div>
<div style="display:flex;justify-content:center;padding-top:60px">
  <div class="card" style="width:280px;display:flex;flex-direction:column;gap:14px;align-items:center">
    <i class="ti ti-mail" style="font-size:30px;color:var(--accent)"></i>
    <div class="heading" style="font-size:18px">Inbox cleanup</div>
    <div style="width:100%">
      <div class="label-11">Password</div>
      <input type="password" style="width:100%">
    </div>
    <div style="font-size:12px;color:var(--danger-text);align-self:flex-start">Incorrect password</div>
    <button class="btn btn-primary" style="width:100%;justify-content:center">Sign in</button>
  </div>
</div>
</body>
</html>
