services:
  gmail-cleaner:
    # Option 1: Build locally (active by default) - this fork doesn't
    # publish its own prebuilt image yet. Once it does, switch to Option 2
    # below instead of building from source every time.
    build: .

    # Option 2: This fork's own published image (once it exists - comment
    # out "build: ." above and uncomment these two lines instead)
    # image: ghcr.io/jatin17solanki/gmail-cleaner:latest
    # pull_policy: always

    # Option 3: Upstream's image - the original project, without this
    # fork's fixes/features (multi-account, Restore, Routines, quota
    # awareness, per-email preview, login gate, and more - see the README's
    # roadmap for the full list)
    # image: ghcr.io/gururagavendra/gmail-cleaner:latest
    # pull_policy: always

    ports:
      - "127.0.0.1:8766:8766"  # Web UI (bound to localhost only - #111)
      - "127.0.0.1:8767:8767"  # OAuth callback (bound to localhost only - #111)
    volumes:
      - type: bind
        source: ./credentials.json
        target: /app/credentials.json
        bind:
          create_host_path: false
        read_only: true
      # Mount data directory for persistent storage (token.json and other data)
      # The token.json file will be automatically stored in /app/data/token.json
      # and persisted to ./data/token.json on the host
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: true
    environment:
      - WEB_AUTH=true

      # REQUIRED to protect this instance: set a strong shared password
      # gating the whole app (login page, all action endpoints). Without
      # this, the app runs with no login gate at all.
      # - APP_PASSWORD=changeme

      # Uncomment and set OAUTH_HOST if accessing via custom domain or server IP
      # - OAUTH_HOST=gmail.example.com

      # Uncomment and set OAUTH_EXTERNAL_PORT if using custom port mapping
      # (e.g., if you map ports like "18767:8767", set OAUTH_EXTERNAL_PORT=18767)
      # - OAUTH_EXTERNAL_PORT=18767
    restart: unless-stopped
